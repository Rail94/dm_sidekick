{% extends 'base.html' %}

{% block title %}{% endblock %}

{% block content %}
<h1 class="mb-5">{{ title }}</h1>
<div class="d-flex justify-content-center">

    <form id="initiative-form" class="mb-4 text-center">
        <div class="mb-4 text-center">

            <div class="mb-3">
                <label for="mode" class="form-label fw-bold">Mode</label>
                <select id="mode" class="form-select w-50 mx-auto" onchange="toggleInitiative()">
                    <option value="auto" selected>Auto</option>
                    <option value="manual">Manual</option>
                </select>
            </div>

            <div class="mb-3 d-none" id="initiative-container">
                <label for="initiative" class="form-label fw-bold">Initiative</label>
                <input type="number" class="form-control w-50 mx-auto" id="initiative" name="initiative"
                    placeholder="Initiative">
            </div>

        </div>
        <div class="mb-3">
            <label for="name" class="form-label fw-bold">Name</label>
            <input type="text" class="form-control" id="name" name="name" maxlength="15" required>
        </div>
        <div class="mb-3" id="bonus-initiative-container">
            <label for="bonus-initiative" class="form-label fw-bold">Bonus Initiative</label>
            <input type="number" class="form-control" id="bonus-initiative" name="bonus-initiative"
                placeholder="Default: 0">
        </div>
        <div class="mb-3">
            <label for="hp" class="form-label fw-bold">Hit Points</label>
            <input type="number" min="0" max="9999" class="form-control" id="hp" name="hp" placeholder="Default: 0">
        </div>
        <div class="mb-3">
            <label for="quantity" class="form-label fw-bold">Quantity</label>
            <input type="number" min="1" max="999" class="form-control" id="quantity" name="quantity" value="1"
                required>
        </div>
        <button type="submit" class="btn btn-primary">Insert</button>
    </form>
</div>

<div class="row">
    <div class="text-center mb-5">
        <h3>Round <span id="round">1</span></h3>
        <button id="rotateButton" class="btn"><img src="{{ url_for('static', filename='img/arrow-clockwise.svg') }}"
                width="40" height="40" alt="round">
        </button>
    </div>
    <div class="text-center mb-3">
        <button id="sortButton" class="btn btn-primary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sort-down-alt" viewBox="0 0 16 16">
        <path d="M3.5 3.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 12.293zm4 .5a.5.5 0 0 1 0-1h1a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h3a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h5a.5.5 0 0 1 0 1zM7 12.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0-.5.5"/>
        </svg>Sort Descending</button>
    </div>
    <div class="text-center mb-3">
        <button id="rerollButton" class="btn btn-primary">Reroll Initiatives</button>
    </div>
    <table id="initiative-table" class="table">
        <thead>
            <tr>
                <th class="bg-dark text-white">Initiative</th>
                <th class="bg-dark text-white">Name</th>
                <th class="bg-dark text-white">Hit Points</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</div>

<script src="{{ url_for('static', filename='js/initiative.js') }}"></script>
{% endblock %}
